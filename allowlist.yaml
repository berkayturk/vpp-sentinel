# The authority the incident agent holds. The operator writes this file; the agent only
# reads it. Change it through a pull request (see CODEOWNERS). Every tool checks it in code.
actions:
  restart_deployment:
    namespace: vpp
    names: [ingestion]
    cooldown_minutes: 30
pull_requests:
  enabled: true
  allowed_paths: [services/ingestion/]
  # Outside the agent's scope, plus the build and configuration files inside it: a code fix
  # changes source and tests, never dependencies, images, migrations or test plumbing.
  forbidden_paths:
    - allowlist.yaml
    - services/agent/
    - .github/
    - CODEOWNERS
    - services/ingestion/pyproject.toml
    - services/ingestion/Dockerfile
    - services/ingestion/migrations/
    - services/ingestion/tests/conftest.py
