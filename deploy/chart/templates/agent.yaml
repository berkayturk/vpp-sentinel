{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    {{- include "vpp.labels" . | nindent 4 }}
---
# The agent's Kubernetes authority mirrors allowlist.yaml: patch (rollout restart) on the one
# deployment it may restart, and nothing else. A second line of defence behind the tool's check.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-restart
  labels:
    {{- include "vpp.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ingestion"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-restart
  labels:
    {{- include "vpp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: agent
roleRef:
  kind: Role
  name: agent-restart
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    {{- include "vpp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        {{- include "vpp.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ .Values.images.agent }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp/home
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: HTTP_PORT
              value: "8001"
            - name: LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: AGENT_MODEL
              value: {{ .Values.agent.model | quote }}
            - name: AGENT_EFFORT
              value: {{ .Values.agent.effort | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.agent.pollIntervalSeconds | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.agent.repo | quote }}
            - name: GIT_AUTHOR
              value: {{ .Values.agent.gitAuthor | quote }}
            - name: KUBE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ALERTMANAGER_URL
              value: {{ .Values.agent.endpoints.alertmanager | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.agent.endpoints.prometheus | quote }}
            - name: LOKI_URL
              value: {{ .Values.agent.endpoints.loki | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.agent.endpoints.grafana | quote }}
            - name: GRAFANA_USER
              value: {{ .Values.agent.grafana.user | quote }}
            - name: GRAFANA_PASSWORD
              value: {{ .Values.agent.grafana.password | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            # Created by `make demo` from the environment; optional so the platform runs without it.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: GITHUB_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# The agent's only write to the cluster is a rollout restart. RBAC limits it to this deployment;
# this policy limits the patch itself: everything but the restart annotation must stay equal.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-restart-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: only-the-agent
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:agent'"
  variables:
    - name: restartKey
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newAnnotations
      expression: "object.spec.template.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.spec.template.metadata.?annotations.orValue({})"
  validations:
    - expression: "object.spec.template.spec == oldObject.spec.template.spec"
      message: "the agent may only restart a deployment, not change its pod spec"
    - expression: >-
        object.spec.replicas == oldObject.spec.replicas
        && object.spec.selector == oldObject.spec.selector
        && object.spec.?paused == oldObject.spec.?paused
        && object.spec.?strategy == oldObject.spec.?strategy
        && object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds
        && object.spec.?progressDeadlineSeconds == oldObject.spec.?progressDeadlineSeconds
        && object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit
      message: "the agent may not scale, pause, reselect or change the rollout of a deployment"
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels
        && object.metadata.?annotations == oldObject.metadata.?annotations
        && object.metadata.?finalizers == oldObject.metadata.?finalizers
        && object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: "the agent may not change a deployment's own metadata"
    - expression: "object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels"
      message: "the agent may not relabel pods"
    - expression: >-
        variables.newAnnotations.filter(k, k != variables.restartKey)
          .all(k, k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])
        && variables.oldAnnotations.filter(k, k != variables.restartKey)
          .all(k, k in variables.newAnnotations)
      message: "the agent may only set the restart annotation on pods"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-restart-only
spec:
  policyName: agent-restart-only
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    {{- include "vpp.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 8001
      targetPort: http
{{- end }}
