apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    app.kubernetes.io/name: ingestion
    {{- include "vpp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
        {{- include "vpp.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: ingestion
          image: {{ .Values.images.ingestion }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: MQTT_HOST
              value: mosquitto
            - name: MQTT_PORT
              value: "1883"
            - name: HTTP_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: {{ .Values.ingestion.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels:
    app.kubernetes.io/name: ingestion
    {{- include "vpp.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ingestion
  ports:
    - name: http
      port: 8000
      targetPort: http
