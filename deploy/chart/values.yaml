# Demo values. Everything here runs on a laptop inside kind; nothing is production-grade.

images:
  fleetSimulator: vpp-fleet-simulator:dev
  ingestion: vpp-ingestion:dev
  mosquitto: eclipse-mosquitto:2.0
  postgres: postgres:16
  pullPolicy: IfNotPresent

fleet:
  cadenceSeconds: 5
  logLevel: INFO

ingestion:
  logLevel: INFO
  # Deliberately tight: a load surge should be able to pressure this pod. The single consumer
  # stores roughly 4,000 messages per second per CPU core, so a 100m limit caps it near
  # 400 messages per second; the fleet's normal rate is 60.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

postgres:
  database: vpp
  user: vpp
  # Demo-only credential. It never leaves the kind cluster and is not a secret worth protecting.
  password: vpp-demo-password
