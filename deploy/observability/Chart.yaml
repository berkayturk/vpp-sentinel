apiVersion: v2
name: vpp-observability
description: Prometheus, Alertmanager, Grafana, Loki and Alloy for the vpp-sentinel demo, plus the repository's own alert rules and dashboards.
type: application
version: 0.1.0
dependencies:
  - name: kube-prometheus-stack
    version: 92.17.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 7.5.0
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: 1.15.0
    repository: https://grafana.github.io/helm-charts
