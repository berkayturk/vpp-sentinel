[project]
name = "vpp-agent"
version = "0.1.0"
description = "Incident agent: wakes on a firing alert, investigates with a fixed set of tools, reports, and acts only within the allowlist."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.4,<26",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-asyncio>=0.25,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
addopts = "--cov=agent --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/main.py"]
