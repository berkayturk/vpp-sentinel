[project]
name = "vpp-fleet-simulator"
version = "0.1.0"
description = "Simulated fleet of EV chargers, batteries and solar inverters publishing telemetry over MQTT."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_simulator"]

[tool.pytest.ini_options]
addopts = "--cov=fleet_simulator --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
