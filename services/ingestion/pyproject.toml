[project]
name = "vpp-ingestion"
version = "0.1.0"
description = "Consumes fleet telemetry from MQTT, validates it and stores it in PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
addopts = "--cov=ingestion --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
